<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: DejaVu Sans, sans-serif;
      margin: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      page-break-inside: avoid;
    }

    td {
      width: 33.33%;
      height: 120px;
      vertical-align: top;
      text-align: center;
      padding: 5px;
    }

    .name {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .variant {
      font-size: 12px;
      color: #555;
    }

    .price-row {
      width: 100%;
      font-size: 12px;
      margin-top: 20px;
      border-collapse: collapse;
    }

    .price-row td:first-child {
      text-align: left;
    }

    .price-row td:last-child {
      text-align: right;
    }
  </style>
</head>

<body>
  <h2>Preview</h2>
  <table>
    {% for product in products %}
    {% if forloop.counter0|divisibleby:3 %}<tr>{% endif %}
      <td>
        <div class="name">
          {{ product.name }}
          {% if product.variant %}<span class="variant">({{ product.variant }})</span>{% endif %}
        </div>
        <table class="price-row">
          <tr>
            <td>MRP: {{ product.mrp }}</td>
            <td>Price: {{ product.price }}</td>
          </tr>
        </table>
      </td>
      {% if forloop.counter|divisibleby:3 %}
    </tr>{% endif %}
    {% endfor %}
  </table>
  <br>
  <a href="{% url 'download_pdf' %}"><button>Download PDF</button></a>
  <a href="{% url 'view_pdf' %}" target="_blank"><button>View PDF in Browser</button></a>
</body>

</html>
